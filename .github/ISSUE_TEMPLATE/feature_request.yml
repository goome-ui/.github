name: Feature request
description: Something you want goome to do
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What do you want
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What would you use it for
    validations:
      required: true
  - type: dropdown
    id: pr
    attributes:
      label: Would you send a PR for it?
      options:
        - "Yes"
        - Maybe, with some help
        - "No"
    validations:
      required: true
